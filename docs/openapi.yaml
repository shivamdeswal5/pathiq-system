# - Notifications: ../labOS-service/src/modules/notifications/notifications.openapi.yaml
# - Collections:   ../labOS-service/src/modules/collections/collections.openapi.yaml
# - WebSockets:    ../labOS-service/src/modules/websockets/websockets.openapi.yaml
